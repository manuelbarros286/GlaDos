AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GlaDos Intelligence API - Serverless Backend

Resources:
  GlaDosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.api.main.handler  #Mangum handler
      Runtime: python3.14
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
      Events:
        GlaDosApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: any

Parameters:
  DatabaseUrl:
    Type: String
    Description: Connection string for supabase
