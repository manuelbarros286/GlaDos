version: '3.8'

services:
  db:
    image: postgres:15
    container_name: signal_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: signal_db
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: signal_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
